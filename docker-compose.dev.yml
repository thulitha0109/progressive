version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-progressive}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    image: progressive-app-dev
    ports:
      - "3003:3000"
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      init-job:
        condition: service_completed_successfully
    environment:
      # Update AUTH_URL for dev environment
      AUTH_URL: http://localhost:3003
      # Override DATABASE_URL to ensure it uses the container service name, not localhost from .env
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-progressive}}
      # Set NODE_ENV to development for hot reloading
      NODE_ENV: development
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadminpassword}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-progressive-uploads}
      NEXT_PUBLIC_S3_PUBLIC_URL: /s3-storage
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  init-job:
    image: progressive-app-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Use same DB URL as app
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-progressive}}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadminpassword}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-progressive-uploads}
    command: >
      sh -c "until npx prisma migrate deploy --schema=./src/prisma/schema.prisma; do echo 'Waiting for database to be ready...'; sleep 2; done && npx tsx scripts/seed-dev.ts && npx tsx scripts/init-storage.ts"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadminpassword}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3